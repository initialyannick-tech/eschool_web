<div class="modal-header border-0 pb-0">
  <h5 class="modal-title fw-semibold">
    <i class="bi bi-shield-fill-check me-2 text-primary"></i>
    Gérer un rôle
  </h5>
  <a (click)="close()" class="btn-close"></a>
</div>

<form (submit)="submit()" [formGroup]="roleForm">
  <div class="modal-body pt-3">

    <!-- Informations générales -->
    <div class="mb-4">
      <h6 class="section-title">
        <i class="bi bi-info-circle me-1"></i>
        Informations générales
      </h6>

      <div class="row g-3 mt-1">
        <div class="col-12">
          <label class="form-label">Libellé</label>
          <input
            class="form-control"
            formControlName="libelle"
            type="text"
            placeholder="Nom du rôle">
        </div>

        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea
            class="form-control"
            formControlName="description"
            rows="4"
            placeholder="Description du rôle">
          </textarea>
        </div>
      </div>
    </div>

    <!-- Permissions -->
    <div class="mb-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="section-title mb-0">
          <i class="bi bi-key-fill me-1"></i>
          Permissions
        </h6>
        <small>Selectionnées ( {{ permissionsSelected.length }} )</small>
      </div>

      @for (permission of permissionItems; track permission.id) {
        <div class="input-group mb-2 align-items-center">
          <span class="input-group-text p-2">
            <input
              (change)="checkPerm($event)"
              [checked]="permission.checked"
              [value]="permission.id"
              class="form-check-input"
              type="checkbox">
          </span>
          <input
            [value]="permission.libelle"
            class="form-control"
            disabled
            type="text">
        </div>
      }
    </div>

  </div>

  <!-- Footer -->
  <div class="modal-footer border-0 pt-0">
    @if (isEdit) {
      @if (isSubmit) {
        <button class="btn btn-success px-4" disabled>
          <i class="bi bi-arrow-repeat me-1"></i> Chargement...
        </button>
      } @else {
        <button class="btn btn-success px-4" type="submit">
          <i class="bi bi-check-circle me-1"></i> Mettre à jour
        </button>
      }
    } @else {
      @if (isSubmit) {
        <button class="btn btn-primary px-4" disabled>
          <i class="bi bi-arrow-repeat me-1"></i> Chargement...
        </button>
      } @else {
        <button class="btn btn-primary px-4" type="submit">
          <i class="bi bi-save me-1"></i> Sauvegarder
        </button>
      }
    }
  </div>
</form>

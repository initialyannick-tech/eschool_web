<div class="modal-header">
  <h5 class="modal-title">Modifier le mot de passe</h5>
  <a (click)="close()" class="btn-close"></a>
</div>
<form (submit)="submit()" [formGroup]="passwordForm">
  <div class="modal-body">
    <div class="row">
      <div class="col-12 mb-3">
        <label>Nouveau mot de passe : </label>
        <div class="input-group mb-3">
          <input [type]="(showPassword) ? 'text': 'password'" class="form-control" formControlName="password">
          <span (click)="showPasswordInput()" class="input-group-text">
                        @if (showPassword) {
                          <i class="bi bi-eye-slash"></i>
                        } @else {
                          <i class="bi bi-eye"></i>
                        }
                    </span>
        </div>
      </div>
      <div class="col-12 mb-3">
        <label>Confirmation de mot de passe : </label>
        <div class="input-group mb-3">
          <input [type]="(showPassword) ? 'text': 'password'" class="form-control"
                 formControlName="password_confirmation">
          <span class="input-group-text">
                         @if (showPassword) {
                           <i class="bi bi-eye-slash"></i>
                         } @else {
                           <i class="bi bi-eye"></i>
                         }
                    </span>

        </div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    @if (isSubmit) {
      <button class="btn btn-success" disabled>Chargement...</button>
    } @else {
      <button class="btn btn-success" type="submit">Mettre à jour</button>
    }
  </div>
</form>

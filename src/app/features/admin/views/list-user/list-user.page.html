<br/>
<app-page-header [backBtn]="true" [titre]="'Liste des Utilisateurs'"></app-page-header>
<div class="row mt-3">
  <div class="col-3">
    <div class="btn-group">
      <a (click)="add()" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Ajouter un utilisateur</a>
    </div>
  </div>
  <div class="col-2 ms-auto">
    <input class="form-control" placeholder="Recherche" type="text">
  </div>
</div>
<div class="card mt-3">
  <div class="card-body">
    <div class="row">
      <div class="col-12">
        <table class="table">
          <thead class="table-primary">
          <tr style="text-align: center;">
            <th scope="col">Nom</th>
            <th scope="col">Prénom</th>
            <th scope="col">Email</th>
            <th scope="col">Rôle</th>
            <th scope="col">Statut</th>
            <th scope="col">Actions</th>
          </tr>
          </thead>
          <tbody>
            @if (isLoad) {
              <tr style="text-align: center;">
                <td colspan="5" class="text-center">Chargement...</td>
              </tr>
            } @else {
              @for (user of users; track user.id) {
                <tr style="text-align: center;">
                  <th> {{ user.nom }} </th>
                  <th> {{ user.prenom }}</th>
                  <th> {{ user.email }}</th>
                  <td> {{ user.role.libelle }}</td>
                  <td>
                    @if (user.status === 'active') {
                      <span class="badge bg-success">Actif</span>
                    } @else {
                      <span class="badge bg-warning">Inactif</span>
                    }
                  </td>
                  <td>
                    <div class="btn-group" role="group" aria-label="Basic outlined example">
                      <a (click)="edit(user)" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-pencil"></i>
                      </a>
                    </div>
                  </td>
                </tr>
              }
            }
          </tbody>
        </table>
      </div>
    </div>
    <div class="d-flex justify-content-end p-2">
      <app-custom-pagination (pageChange)="changePage($event)" [links]="pagination">
      </app-custom-pagination>
    </div>
  </div>
</div>

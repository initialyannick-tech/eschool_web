<app-page-header [backBtn]="true" [titre]="'Liste des poste'"></app-page-header>
<div class="row mt-3">
  <div class="col-3">
    <div class="btn-group">
      <a (click)="add()" class="btn btn-primary">Nouveau poste</a>
    </div>
  </div>
  <div class="col-2 ms-auto">
    <input (keyup)="searchAction()" [(ngModel)]="searchText" class="form-control" placeholder="Recherche" type="text">
  </div>
</div>
<div class="card mt-3">
  <div class="card-body">
    <div class="row">
      <div class="col-12">
        <table class="table">
          <thead class="table-primary">
          <tr style="text-align: center;">
            <th scope="col">Code</th>
            <th scope="col">Libelle</th>
            <th scope="col">Slug</th>
            <th scope="col">Statut</th>
            <th class="text-end" scope="col">Actions</th>
          </tr>
          </thead>
          <tbody>
            @if (isLoad) {
              <tr>
                <td colspan="8" class="text-center">Chargement...</td>
              </tr>
            }@else {
              @for (poste  of postes; track poste .id) {
                <tr style="text-align: center;">
                  <td> {{ poste.code }}</td>
                  <td> {{ poste.libelle }}</td>
                  <td> {{ poste.slug }}</td>
                  <td>
                    @if (poste.actif) {
                      <span class="badge bg-success">Actif</span>
                    } @else {
                      <span class="badge bg-danger">Inactif</span>
                    }
                  </td>
                  <td class="text-end">
                    <div class="btn-group" role="group" aria-label="Basic outlined example">
                      <a class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-search"></i>
                      </a>
                      <a (click)="edit(poste)" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-pencil"></i>
                      </a>
                      <a class="btn btn-sm btn-outline-danger">
                        <i class="bi bi-trash"></i>
                      </a>
                    </div>
                  </td>
                </tr>
              }
            }
          </tbody>
        </table>
      </div>
    </div>
    <div class="d-flex justify-content-end p-2">
      <app-custom-pagination (pageChange)="changePage($event)" [links]="pagination">
      </app-custom-pagination>
    </div>
  </div>
</div>

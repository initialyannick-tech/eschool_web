<div class="app-shell">
  <header class="app-topbar">
    <div class="app-topbar__left">
      <button class="topbar-toggle" type="button" (click)="toggleSidebar()" aria-label="Afficher ou masquer le menu">
        <i class="bi bi-list"></i>
      </button>
      <div class="topbar-brand">
        <div class="topbar-brand__logo">
          <img src="assets/img/eschool_logo.png" alt="Logo eSchool">
        </div>
        <span class="topbar-brand__name">
          eSchool
        </span>
      </div>

    </div>

    <div class="app-topbar__right">

      <div class="dropdown topbar-user">

        <button
          class="topbar-user__button dropdown-toggle"
          type="button"
          data-bs-toggle="dropdown"
          aria-expanded="false">

          <span class="topbar-user__avatar">
            <i class="bi bi-person-fill"></i>
          </span>

          <span class="topbar-user__name">
            {{ userConnected.nom }} {{ userConnected.prenom }}
          </span>

        </button>

        <ul class="dropdown-menu dropdown-menu-end topbar-user__menu">

          <li>
            <a
              class="dropdown-item"
              routerLink="/profile">

              <i class="bi bi-person me-2"></i>
              Profil

            </a>
          </li>

          <li>
            <a
              class="dropdown-item"
              routerLink="/settings">

              <i class="bi bi-gear me-2"></i>
              Paramètres

            </a>
          </li>

          <li>
            <a
              class="dropdown-item"
              routerLink="/notifications">

              <i class="bi bi-bell me-2"></i>
              Notifications

            </a>
          </li>

          <li>
            <hr class="dropdown-divider">
          </li>

          <li>
            <a
              href="javascript:void(0)"
              class="dropdown-item topbar-user__logout"
              (click)="logout()">

              <i class="bi bi-box-arrow-right me-2"></i>
              Déconnexion

            </a>
          </li>

        </ul>

      </div>

    </div>

  </header>


  <!-- =================================================
       OVERLAY MOBILE
  ================================================== -->
  @if (isMobile && isSidebarOpen) {

    <div
      class="app-overlay"
      (click)="toggleSidebar()">
    </div>

  }


  <!-- =================================================
       BARRE LATÉRALE
  ================================================== -->
  <aside
    class="app-sidebar"
    [class.app-sidebar--collapsed]="!isSidebarOpen">

    <nav class="sidebar-nav">

      <!-- =================================================
           GROUPE : GÉNÉRAL
      ================================================== -->
      <div class="sidebar-nav__group">

        <span class="sidebar-nav__label">
          Général
        </span>

        <a
          class="sidebar-nav__link"
          routerLink="/dashboard"
          routerLinkActive="sidebar-nav__link--active">

          <i class="bi bi-speedometer2"></i>

          <span>
            Dashboard
          </span>

        </a>


        <a
          class="sidebar-nav__link"
          routerLink="/calendar"
          routerLinkActive="sidebar-nav__link--active">

          <i class="bi bi-calendar-event"></i>

          <span>
            Calendrier
          </span>

        </a>


        <a
          class="sidebar-nav__link"
          routerLink="/stats"
          routerLinkActive="sidebar-nav__link--active">

          <i class="bi bi-bar-chart"></i>

          <span>
            Statistiques
          </span>

        </a>

      </div>


      <!-- =================================================
           GROUPE : GESTION
      ================================================== -->
      <div class="sidebar-nav__group">

        <span class="sidebar-nav__label">
          Gestion
        </span>


        <a
          class="sidebar-nav__link"
          *ngxPermissionsOnly="['service.management']"
          routerLink="/departement/list"
          routerLinkActive="sidebar-nav__link--active">

          <i class="bi bi-building"></i>

          <span>
            Départements
          </span>

        </a>


        <a class="sidebar-nav__link" *ngxPermissionsOnly="['metier.management']" routerLink="/departement/list-metier" routerLinkActive="sidebar-nav__link--active">
          <i class="bi bi-hdd-network-fill"></i>
          <span>Métiers</span>
        </a>

        <a class="sidebar-nav__link" *ngxPermissionsOnly="['poste.management']" routerLink="/departement/list-poste" routerLinkActive="sidebar-nav__link--active">
          <i class="bi bi-sliders"></i>
          <span>Postes</span>
        </a>


        <a class="sidebar-nav__link" *ngxPermissionsOnly="['agent.management']" routerLink="/agent/list" routerLinkActive="sidebar-nav__link--active">
          <i class="bi bi-person-arms-up"></i>
          <span>Agents</span>
        </a>


        <a class="sidebar-nav__link" *ngxPermissionsOnly="['ligue.management']" routerLink="/ligue/list" routerLinkActive="sidebar-nav__link--active">
          <i class="bi bi-trophy"></i>
          <span>Gestion Ligues</span>
        </a>
      </div>


      <!-- =================================================
           GROUPE : ADMINISTRATION
      ================================================== -->
      <div class="sidebar-nav__group">
        <span class="sidebar-nav__label">
          Administration
        </span>
        <a class="sidebar-nav__link" *ngxPermissionsOnly="['parent.management']" routerLink="/pedagogie/list-parent" routerLinkActive="sidebar-nav__link--active">
          <i class="bi bi-person-rolodex"></i>
          <span>Gestion Parents</span>
        </a>
        <a class="sidebar-nav__link" *ngxPermissionsOnly="['classe.management']" routerLink="/pedagogie/list-classe" routerLinkActive="sidebar-nav__link--active">
          <i class="bi bi-building-add"></i>
          <span>Gestion Classes</span>
        </a>
        <a class="sidebar-nav__link" *ngxPermissionsOnly="['user.management']"  routerLink="/admin/users" routerLinkActive="sidebar-nav__link--active">
          <i class="bi bi-people-fill"></i>
          <span>Gestion Users</span>
        </a>

        <a class="sidebar-nav__link" *ngxPermissionsOnly="['role.management']" routerLink="/admin/roles" routerLinkActive="sidebar-nav__link--active">
          <i class="bi bi-shield-check"></i>
          <span>Gestion Rôles</span>
        </a>
      </div>


      <!-- =================================================
           GROUPE : SYSTÈME
      ================================================== -->
      <div class="sidebar-nav__group">
        <span class="sidebar-nav__label">Système</span>
        <a class="sidebar-nav__link" routerLink="/settings" routerLinkActive="sidebar-nav__link--active">
          <i class="bi bi-gear"></i>
          <span>Paramètres</span>
        </a>
      </div>
    </nav>
  </aside>


  <!-- =================================================
       CONTENU PRINCIPAL
  ================================================== -->
  <main class="app-content" [class.app-content--expanded]="!isSidebarOpen">
    <router-outlet></router-outlet>
  </main>
</div>

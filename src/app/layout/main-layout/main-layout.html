<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg fixed-top navbar-custom">
  <div class="container-fluid">
    <!-- MENU BUTTON -->
    <button
      class="btn btn-menu"
      type="button"
      (click)="toggleSidebar()">
      <i class="bi bi-list"></i>
    </button>
    <!-- LOGO -->
    <a class="navbar-brand">
      GPEC
    </a>
    <!-- USER -->
    <div class="ms-auto">
      <div class="dropdown">
        <button class="btn btn-user dropdown-toggle" type="button" data-bs-toggle="dropdown">
          <i class="bi bi-person-circle me-2"></i>
          {{ userConnected.nom }}
          {{ userConnected.prenom }}
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li>
            <a class="dropdown-item">
              <i class="bi bi-person me-2"></i>
              Profil
            </a>
          </li>
          <li>
            <a class="dropdown-item">
              <i class="bi bi-gear me-2"></i>
              Paramètres
            </a>
          </li>
          <li>
            <a class="dropdown-item">
              <i class="bi bi-bell me-2"></i>
              Notifications
            </a>
          </li>
          <li>
            <hr class="dropdown-divider">
          </li>
          <li>
            <a
              class="dropdown-item text-danger"
              (click)="logout()">
              <i class="bi bi-box-arrow-right me-2"></i>
              Déconnexion
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</nav>
<!-- ================= OVERLAY MOBILE ================= -->

@if (isMobile && isSidebarOpen) {
  <div class="sidebar-overlay" (click)="toggleSidebar()"></div>
}


<!-- ================= SIDEBAR ================= -->
<div class="sidebar" [class.collapsed]="!isSidebarOpen">
  <ul class="sidebar-menu">
    <li>
      <a
        routerLink="/dashboard"
        routerLinkActive="active-link">
        <i class="bi bi-speedometer2"></i>
        <span>
         Dashboard
         </span>
      </a>
    </li>
    <li *ngxPermissionsOnly="['service.management']">
      <a routerLink="/departement/list" routerLinkActive="active-link">
        <i class="bi bi-building"></i>
        <span>Départements</span>
      </a>
    </li>
    <li *ngxPermissionsOnly="['metier.management']">
      <a routerLink="/departement/list-metier" routerLinkActive="active-link">
        <i class="bi bi-hdd-network-fill"></i>
        <span>Métiers</span>
      </a>
    </li>
    <li *ngxPermissionsOnly="['poste.management']">
      <a routerLink="/departement/list-poste" routerLinkActive="active-link"><i class="bi bi-sliders"></i>
        <span>Postes</span>
      </a>
    </li>
    <li *ngxPermissionsOnly="['agent.management']">
      <a routerLink="/agent/list" routerLinkActive="active-link"><i class="bi bi-person-arms-up"></i>
        <span>Agents</span>
      </a>
    </li>
    <li>
      <a routerLink="/calendar">
        <i class="bi bi-calendar-event"></i>
        <span>Calendrier</span>
      </a>
    </li>
    <li>
      <a routerLink="/stats">
        <i class="bi bi-bar-chart"></i>
        <span>Statistiques</span>
      </a>
    </li>
    <li>
      <a routerLink="/settings">
        <i class="bi bi-gear"></i>
        <span>Paramètres</span>
      </a>
    </li>
    <li *ngxPermissionsOnly="['ligue.management']">
      <a routerLink="/ligue/list" routerLinkActive="active-link">
        <i class="bi bi-trophy"></i>
        <span>Gestion Ligues</span>
      </a>
    </li>
    <li *ngxPermissionsOnly="['user.management']">
      <a
        routerLink="/admin/users"
        routerLinkActive="active-link">
        <i class="bi bi-people-fill"></i>
        <span>
         Gestion Users
         </span>
      </a>
    </li>
    <li *ngxPermissionsOnly="['role.management']">
      <a
        routerLink="/admin/roles"
        routerLinkActive="active-link">
        <i class="bi bi-shield-check"></i>
        <span>
         Gestion Rôles
         </span>
      </a>
    </li>
  </ul>
</div>
<!-- ================= CONTENT ================= -->
<div
  class="content"
  [class.expanded]="!isSidebarOpen">
  <router-outlet></router-outlet>
</div>

<nav class="eschool-pagination" aria-label="Navigation des pages">
  <ul class="pagination">
    @for (link of links; track link.url) {
      @if (link.label == '&laquo; Previous') {
        <li class="page-item pagination-navigation">
          <a
            class="page-link"
            (click)="onPageChange(link.url)"
            aria-label="Page précédente"
          >
            <span class="pagination-icon" aria-hidden="true">‹</span>
            <span class="pagination-text">Précédent</span>
          </a>
        </li>
      } @else if ((link.label == 'Next &raquo;')) {
        <li class="page-item pagination-navigation">
          <a class="page-link" (click)="onPageChange(link.url)" aria-label="Page suivante">
            <span class="pagination-text">Suivant</span>
            <span class="pagination-icon" aria-hidden="true">›</span>
          </a>
        </li>
      } @else {
        <li class="page-item" [ngClass]="{'active': link.active == true}">
          <a class="page-link" (click)="onPageChange(link.url)">{{ link.label }}</a>
        </li>
      }
    }
  </ul>
</nav>

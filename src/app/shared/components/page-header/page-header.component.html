<div class="page-header">
  <div class="page-header__breadcrumb">
    <span class="breadcrumb-parent"></span>
    <i class="fa fa-angle-right"></i>
    <span class="breadcrumb-current">
    </span>
  </div>
  <div class="page-header__body">
    <div class="page-header__identity">
      <div class="page-header__icon">
        <i class="fa fa-users"></i>
      </div>
      <div class="page-header__information">
        <div class="page-header__title-line">
          <h1>{{ titre() }}</h1>
          <span class="page-header__badge">
            Administration
          </span>
        </div>
        <p class="page-header__description">Gérez la plateforme eSchool.</p>
      </div>
    </div>
    <div class="page-header__actions">
      @if (backBtn()){
      <button type="button" class="btn-back" (click)="back()" aria-label="Retour à la page précédente">
        <i class="fa fa-arrow-left"></i>
        <span>Retour</span>
      </button>
      }
    </div>
  </div>
</div>

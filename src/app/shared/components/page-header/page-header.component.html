<div class="page-header">

  <!-- =========================
       BREADCRUMB
  ========================== -->

  <div class="page-header__breadcrumb">

    <span class="breadcrumb-parent">
      Administration
    </span>

    <i class="fa fa-angle-right"></i>

    <span class="breadcrumb-current">
      Utilisateurs
    </span>

  </div>


  <!-- =========================
       CONTENU PRINCIPAL
  ========================== -->

  <div class="page-header__body">

    <!-- GAUCHE -->
    <div class="page-header__identity">

      <!-- Icône -->
      <div class="page-header__icon">

        <i class="fa fa-users"></i>

      </div>


      <!-- Informations -->
      <div class="page-header__information">

        <div class="page-header__title-line">

          <h1>
            {{ titre() }}
          </h1>

          <span class="page-header__badge">
            Administration
          </span>

        </div>


        <p class="page-header__description">
          Gérez les comptes utilisateurs, leurs rôles et leurs accès
          à la plateforme eSchool.
        </p>


        <!-- Mini informations -->
        <div class="page-header__meta">

          <span>
            <i class="fa fa-users"></i>
            Utilisateurs
          </span>

          <span class="meta-separator"></span>

          <span>
            <i class="fa fa-shield"></i>
            Gestion des accès
          </span>

        </div>

      </div>

    </div>


    <!-- DROITE -->
    <div class="page-header__actions">

      @if (backBtn()){

      <button
        type="button"
        class="btn-back"
        (click)="back()"
        aria-label="Retour à la page précédente"
      >

        <i class="fa fa-arrow-left"></i>

        <span>Retour</span>

      </button>

      }

    </div>

  </div>

</div>
